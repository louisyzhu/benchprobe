name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # lets a run be started by hand from the Actions tab

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lockfile is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: "Smoke test (rule 6: under a minute)"
        run: uv run pytest -m smoke
      - name: "Golden tests collect (never run here; run by ticket, pasted verbatim)"
        run: uv run pytest -m golden --collect-only -q
