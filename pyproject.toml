[project]
name = "benchprobe"
version = "0.1.0"
description = "Psychometrics for AI benchmark scores — reliability, factor structure, predictive validity and item-response scaling — validated by reproducing three published studies from pinned data."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Louis Yiven Zhu" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["psychometrics", "benchmarks", "evaluation", "factor-analysis", "item-response-theory", "reliability", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Lower bounds are the versions the One Capability archive ran on
# (frontier-ai-economic-validity/requirements.txt, Python 3.13). The exact
# environment is pinned by uv.lock; see docs/reproducibility.md.
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "factor_analyzer>=0.5.1",
    "pyarrow>=17.0",  # the Price of Intelligence panel is frozen as Parquet (ticket T6)
]

[project.urls]
Repository = "https://github.com/louisyzhu/benchprobe"
Issues = "https://github.com/louisyzhu/benchprobe/issues"

[project.optional-dependencies]
# Retained but unused: benchprobe.irt (T6) reproduces the archive's Adam-then-L-BFGS fit in
# NumPy/SciPy with an analytic gradient, so torch is not needed. Kept for a future GPU path only.
irt = ["torch>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyyaml>=6.0",  # the smoke test parses .github/workflows/*.yml (see docs/decisions.md, 2026-09-10)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: runs in under a minute on a laptop; CI runs exactly this set",
    "golden: acceptance tests against the locked numbers in tests/golden; run by ticket, never in CI",
    "slow: golden tests that refit the four-learner LOBO ladder (most of the archive's 26-minute run)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
