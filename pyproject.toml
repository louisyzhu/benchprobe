[project]
name = "benchprobe"
version = "0.0.0"
description = "Analysis code behind benchmark-validity studies: trust, measure, predict. In development; nothing here ships before the day it is the analysis code behind a real study."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Louis Yiven Zhu" }]
# Lower bounds are the versions the One Capability archive ran on
# (frontier-ai-economic-validity/requirements.txt, Python 3.13). The exact
# environment is pinned by uv.lock; see docs/reproducibility.md.
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "factor_analyzer>=0.5.1",
]

[project.optional-dependencies]
# PyTorch is one optional dependency, for the IRT estimator only (benchprobe.irt, ticket T6).
irt = ["torch>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyyaml>=6.0",  # the smoke test parses .github/workflows/*.yml (see docs/decisions.md, 2026-09-10)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: runs in under a minute on a laptop; CI runs exactly this set",
    "golden: acceptance tests against the locked numbers in tests/golden; run by ticket, never in CI",
    "slow: golden tests that refit the four-learner LOBO ladder (most of the archive's 26-minute run)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
